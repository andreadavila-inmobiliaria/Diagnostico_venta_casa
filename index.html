.logo.big{height:58px;display:block;margin:0 auto}

/* Cabecera de progreso */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -20px;padding:0 20px}
.bar .in{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;height:62px}
.back{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.back:hover{background:var(--blush)}
.bar .mid{text-align:center}
.bar .blk{font-weight:800;font-size:15px}
.segs{display:flex;gap:6px;justify-content:center;margin-top:6px}
.seg{width:52px;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--coral);border-radius:5px;transition:width .35s ease}
.timer{text-align:right;font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* Tipografía */
h1,h2,h3{margin:0;letter-spacing:-.025em;line-height:1.12}
h1{font-size:clamp(34px,8vw,52px);font-weight:900}
h2{font-size:clamp(25px,5.4vw,32px);font-weight:800}
h3{font-size:20px;font-weight:800}
.lead{color:var(--muted);font-size:18px;margin:12px 0 0;max-width:34em}
.sub{color:var(--muted);margin:8px 0 0;font-size:16px}

/* Portada */
.home h1{margin-top:26px;max-width:11em}
.types{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 22px}
.type{border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:0;cursor:pointer;text-align:left;overflow:hidden;transition:border-color .15s, transform .15s}
.type:hover{border-color:var(--coral);transform:translateY(-2px)}
.type:last-child:nth-child(odd){grid-column:1/-1}
.type:last-child:nth-child(odd) .art{aspect-ratio:8/3}
.type .art{background:var(--blush);color:var(--coral-strong);padding:18px 14px 8px;aspect-ratio:4/3;display:grid;place-items:end center}
.type .art svg{width:100%;height:100%}
.type .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;font-weight:800;font-size:16px}
.type .go{width:28px;height:28px;border-radius:50%;background:var(--coral);color:var(--on-coral);display:grid;place-items:center;flex:none}
.promise{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px;font-weight:600;padding-bottom:36px}
.promise span{display:inline-flex;align-items:center;gap:6px}
.promise svg{color:var(--coral-strong)}

/* Intro */
.intro{display:grid;gap:26px;padding:22px 0 40px}
.who{display:grid;grid-template-columns:1fr;border-radius:26px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.who img{width:100%;aspect-ratio:6/5;object-fit:cover;object-position:50% 18%}
.who .cap{padding:18px 20px 20px}
.who .cap p{margin:6px 0 0;color:var(--muted)}
.who .cap strong{font-size:18px}
@media (min-width:620px){
  .who{grid-template-columns:240px 1fr}
  .who img{aspect-ratio:auto;height:100%;min-height:260px}
  .who .cap{align-self:center}
}

/* Pasos (así funciona / qué pasa ahora) */
.how h3{font-size:18px;margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:14px;position:relative;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::after{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:var(--surface);border:2px solid var(--coral);color:var(--text);position:relative;z-index:1}
.steps li.done .n{background:var(--coral);color:var(--on-coral)}
.steps li.done::after{background:var(--coral)}
.steps li.now .n{border-right-color:transparent;animation:spin 1.1s linear infinite}
.steps li.now .n span{animation:spin 1.1s linear infinite reverse;display:block}
.steps li.later .n{border-color:var(--line);color:var(--muted)}
.steps b{display:block;font-size:16.5px;padding-top:5px}
.steps p{margin:2px 0 0;color:var(--muted);font-size:15px}

/* Botones */
.btn{display:block;appearance:none;border:0;border-radius:999px;padding:17px 26px;font-weight:800;font-size:17px;cursor:pointer;width:100%;text-align:center;text-decoration:none;background:var(--btn);color:var(--on-btn);transition:transform .12s, opacity .12s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.coral{background:var(--coral);color:var(--on-coral)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn .ic{display:inline-flex;vertical-align:-4px;margin-right:8px}

/* Preguntas */
.step{padding:26px 0 40px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blush);color:var(--text);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700;margin-bottom:14px}
.chip svg{color:var(--coral-strong)}
.opts{display:grid;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 18px 18px 20px;font-weight:700;font-size:16.5px;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--coral)}
.opt .mk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.opt.multi .mk{border-radius:8px}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--coral);background:var(--blush)}
.opt[aria-pressed="true"] .mk,.opt[aria-checked="true"] .mk{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.opt .mk svg{opacity:0}
.opt[aria-pressed="true"] .mk svg,.opt[aria-checked="true"] .mk svg{opacity:1}
.after{margin-top:20px}

/* Pantallas de dato */
.fact .ill{margin-top:26px;background:var(--blush);color:var(--coral-strong);border-radius:28px;padding:30px;display:grid;place-items:center}
.fact .ill svg{width:min(320px,80%);height:auto}
.fact p{font-size:18px;color:var(--muted);margin:14px 0 0;max-width:33em}

/* Carga */
.loading{padding:40px 0 280px;text-align:center}
.ring{position:relative;width:180px;height:180px;margin:28px auto}
.ring svg{width:180px;height:180px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.checks{list-style:none;padding:0;margin:0 auto;max-width:360px;text-align:left;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:center;color:var(--muted);font-weight:600;font-size:15.5px}
.checks li .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.checks li .d svg{opacity:0}
.checks li.on{color:var(--text)}
.checks li.on .d{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.checks li.on .d svg{opacity:1}
.checks li.run{color:var(--text)}
.checks li.run .d{border-color:var(--coral);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px -10px rgba(0,0,0,.25);padding:14px 0 calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s linear .4s}
.sheet.show{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{text-align:center}
.sheet .why{text-align:center;color:var(--muted);font-size:14px;font-weight:700;margin-bottom:6px}
.sheet .opts{margin-top:16px}
.scrim{position:fixed;inset:0;background:rgba(24,22,31,.35);z-index:15;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}

/* Formulario */
.form{padding:24px 0 48px}
.ready{display:inline-flex;align-items:center;gap:6px;color:var(--coral-strong);font-weight:800;font-size:15px}
.pbar{height:8px;border-radius:8px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.pbar i{display:block;height:100%;width:95%;background:var(--coral);border-radius:8px}
.prow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-weight:700}
.form h2{margin-top:22px}
.me{display:flex;gap:14px;align-items:center;margin-top:18px}
.me img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.me p{margin:0;font-size:15px;color:var(--muted)}
.me p b{color:var(--text)}
.vid{margin-top:16px;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid video{width:100%;height:100%;object-fit:cover}
.fields{display:grid;gap:16px;margin-top:26px}
label.f{display:grid;gap:6px;font-weight:800;font-size:15px}
label.f input{font:inherit;font-weight:600;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);width:100%}
label.f input::placeholder{color:var(--muted);font-weight:500}
label.f input:focus{outline:none;border-color:var(--coral)}
label.f small{font-weight:500;color:var(--muted);font-size:13px}
.err{color:var(--coral-strong);font-size:13.5px;font-weight:700;min-height:1em}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:4px;cursor:pointer}
.consent input{width:22px;height:22px;accent-color:var(--coral);flex:none;margin-top:1px}
.safe{display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);margin-top:12px}
.safe svg{color:var(--coral-strong)}

/* Confirmación y diagnóstico */
.done-pg,.report{padding:24px 0 40px}
.teaser{margin-top:20px;background:var(--blush);border-radius:24px;padding:20px 22px}
.teaser b{font-size:19px;letter-spacing:-.01em;display:block;line-height:1.3}
.teaser p{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.box{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px}
.cta{margin-top:24px;display:grid;gap:10px}
.cta .note{text-align:center;font-size:14px;color:var(--muted);margin:2px 0 0}
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px}
.score .ring{width:132px;height:132px;margin:0}
.score .ring svg{width:132px;height:132px}
.score .ring .pct{font-size:36px}
.score .ring .pct div{line-height:1;text-align:center}
.score .ring .pct span{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0;margin-top:6px}
.score .verdict{font-weight:900;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.score p{margin:6px 0 0;color:var(--muted);font-size:15px}
.brake{margin-top:16px;background:var(--blush);border-radius:26px;padding:22px}
.brake .k{font-size:14px;font-weight:800;color:var(--coral-strong)}
.brake h3{margin-top:4px;font-size:23px}
.brake p{margin:8px 0 0}
.sect{margin-top:32px}
.plan{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px;counter-reset:p}
.plan>li{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;counter-increment:p}
.plan>li>b{display:flex;gap:12px;align-items:center;font-size:17px}
.plan>li>b::before{content:counter(p);width:32px;height:32px;border-radius:50%;background:var(--dot);color:var(--on-dot);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.plan ul{margin:10px 0 0;padding:0 0 0 44px;color:var(--muted);font-size:15.5px;display:grid;gap:6px}
.tips{display:grid;gap:12px;margin-top:14px}
.tip{border-left:4px solid var(--coral);background:var(--surface);border-radius:4px 18px 18px 4px;padding:14px 18px}
.tip b{display:block;font-size:16.5px}
.tip p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.note-p{margin:16px 0 0;color:var(--muted)}
.sign{display:flex;gap:12px;align-items:center;margin-top:28px;color:var(--muted);font-size:14px}
.sign img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.foot{padding:26px 0 32px}

.body-p{margin:8px 0 0}
.sig{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:4px 18px 18px 4px;padding:16px 18px}
.sig b{display:block;font-size:16.5px}
.sig p{margin:6px 0 0}
.sig .also{color:var(--muted);font-size:15.5px}
.also span,.ex span{font-weight:800;color:var(--text)}
.plan .pt{margin:10px 0 0;color:var(--muted);font-size:15.5px;padding-left:44px}
.plan .ex{margin-top:8px}
.worry{margin-top:12px}
.worry b{display:block;font-size:16.5px}
.worry p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.fn{margin:8px 0 0;color:var(--muted);font-size:13.5px;font-style:italic}

/* Panel Andrea */
.panel{padding:24px 0 56px}
.panel textarea,.panel input{width:100%;font:inherit;font-size:15px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.panel textarea{min-height:90px;resize:vertical}
.panel textarea:focus,.panel input:focus{outline:none;border-color:var(--coral)}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.panel .grid input:last-child{grid-column:1/-1}
.panel .out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:15px;margin-top:12px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{background:var(--blush);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.enter{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.types{gap:10px}.type .lbl{font-size:15px;padding:12px}.score{grid-template-columns:1fr;justify-items:center;text-align:center}.logo{height:32px}}
</style>

/* ---------- Cálculo ---------- */
function compute(a){
  const v = {
    precio: SCORE.precio[key(a,'precio')],
    presentacion: SCORE.material[key(a,'material')],
    difusion: SCORE.promo[key(a,'promo')],
    papeles: SCORE.docs[key(a,'docs')]
  };
  const q1 = key(a,'q1'), q2 = key(a,'q2');
  if (q1==='m13') v.precio -= 5;
  if (q1==='m36'){ v.precio -= 12; v.difusion -= 5; }
  if (q1==='m6'){ v.precio -= 16; v.difusion -= 8; }
  if (q1!=='no' && q2){
    if (q2==='visitas'){ v.presentacion -= 10; v.precio -= 15; }
    if (q2==='bajo'){ v.precio -= 20; }
    if (q2==='nada'){ v.presentacion -= 15; v.difusion -= 15; v.precio -= 10; }
  }
  for (const k in v) v[k] = Math.max(5, Math.min(100, v[k]));
  let idx = 0; for (const k in v) idx += v[k]*AREAS[k].w;
  idx = Math.round(Math.max(12, Math.min(92, idx)));
  const worries = (a.q3||[]).map(i => Q.q3.o[i].k).filter(k => WORRY[k]);
  const bonus = k => worries.some(w => WORRY[w].a===k) ? -0.5 : 0;
  const rank = Object.keys(v).sort((x,y) => (v[x]+bonus(x)) - (v[y]+bonus(y)));
  const weak = Math.max(1, Object.values(v).filter(x => x<60).length);
  const label = idx>=80 ? 'Muy bien preparada' : idx>=60 ? 'Bien encaminada, con ajustes' : idx>=40 ? 'Hay frenos importantes' : 'La venta está frenada';
  const desc = idx>=80 ? 'Tienes casi todo a favor. Lo que queda es afinar los detalles.' : idx>=60 ? 'La base es buena, pero hay puntos que pueden costarte tiempo o dinero.' : idx>=40 ? 'Hay varios puntos que hoy juegan en contra de tu precio.' : 'Tal y como está planteada, la venta tiene difícil salir al precio que buscas.';
  return {v, idx, rank, label, desc, worries, weak};
}

function encode(tipoId, a){
  const t = TIPOS.findIndex(x => x.id===tipoId);
  const mask = (a.q3||[]).reduce((m,i) => m | (1<<i), 0).toString(36).padStart(2,'0');
  const d = id => a[id]==null ? 'x' : a[id];
  return [t, d('q1'), d('q2'), mask, d('precio'), d('material'), d('promo'), d('docs'), d('despues')].join('');
}
function decode(code){
  const P = '([0-9][0-9][0-9x][0-9a-z]{2}[0-9]{4}[0-9x])';
  const m = new RegExp('c[oó]digo:?\\s*'+P,'i').exec(code||'') || new RegExp('(?:^|[^0-9a-z])'+P+'(?![0-9a-z])','i').exec(code||''); if (!m) return null;
  const s = m[1].toLowerCase(), n = c => c==='x' ? null : parseInt(c,10);
  const mask = parseInt(s.slice(3,5),36);
  const a = {q1:n(s[1]), q2:n(s[2]), q3:[0,1,2,3,4,5].filter(i => mask & (1<<i)), precio:n(s[5]), material:n(s[6]), promo:n(s[7]), docs:n(s[8]), despues:n(s[9])};
  const t = n(s[0]);
  if (t==null || !TIPOS[t]) return null;
  for (const id of ['q1','q2','precio','material','promo','docs','despues']) if (a[id]!=null && !Q[id].o[a[id]]) return null;
  for (const id of ['q1','precio','material','promo','docs']) if (a[id]==null) return null;
  return {tipo:TIPOS[t].id, a};
}
const reportUrl = (tipoId, a) => baseUrl() + '#diagnostico-' + encode(tipoId, a);

function waMessage(nombre, tipoId, zona, a){
  const tipo = TIPOS.find(t => t.id===tipoId);
  return `¡Hola${nombre?', '+nombre:''}! Soy Andrea Dávila, asesora inmobiliaria online asociada a NOOW. Ya he analizado tu caso y aquí tienes el diagnóstico de tu ${tipo.noun}${zona?' en '+zona:''}:\n${reportUrl(tipoId, a)}\n\nVerás tu índice de preparación, lo que más está frenando la venta y los pasos que te recomiendo, por orden.\n\nCuando lo leas, ¿te parece que hagamos una videollamada de 20 minutos, sin compromiso, y te cuento cómo he realizado el informe?`;
}

function headerBar(blockIdx, frac, secs){
  const segs = BLOQUES.map((_,i) => {
    const w = i<blockIdx ? 100 : i>blockIdx ? 0 : Math.max(8, frac*100);
    return `<span class="seg"><i style="width:${w}%"></i></span>`;
  }).join('');
  return `<div class="bar"><div class="in">
    <button class="back" id="back" aria-label="Volver">${I.back}</button>
    <div class="mid"><div class="blk">${BLOQUES[blockIdx]}</div><div class="segs" aria-hidden="true">${segs}</div></div>
    <div class="timer" aria-label="Tiempo restante aproximado">${secs} s</div></div></div>`;
}
const stepsList = (items) => `<ol class="steps">${items.map((s,i) => `<li class="${s.state||''}"><span class="n"><span>${s.state==='done'?I.check:i+1}</span></span><div><b>${s.t}</b><p>${s.p}</p></div></li>`).join('')}</ol>`;
function ringSvg(id, size, r, sw){
  const C = 2*Math.PI*r;
  return {C, html:`<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="${sw}"/><circle id="${id}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--coral)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>`};
}

function renderStep(){
  const f = flow(), id = f[st.pos];
  const item = Q[id] || FACTS[id];
  const inBlock = f.filter(x => (Q[x]||FACTS[x]).b===item.b);
  const frac = inBlock.indexOf(id) / inBlock.length;
  const secs = Math.max(5, (f.length - st.pos) * 6 + 4);
  let body;
  if (FACTS[id]){
    body = `<div class="step fact enter"><h2>${item.t}</h2><p>${item.p}</p>
      <div class="ill" aria-hidden="true">${ART[item.art]}</div>
      <div class="after"><button class="btn" id="next">Seguir</button></div></div>`;
  } else {
    const multi = !!item.multi, cur = st.a[id];
    body = `<div class="step enter">${item.chip?`<div class="chip">${I.check} ${item.chip}</div>`:''}
      <h2>${item.t}</h2>${item.sub?`<p class="sub">${item.sub}</p>`:''}
      <div class="opts" role="${multi?'group':'radiogroup'}">${item.o.map((op,i) => {
        const on = multi ? (cur||[]).includes(i) : cur===i;
        return `<button class="opt${multi?' multi':''}" data-i="${i}" ${multi?`aria-pressed="${on}"`:`role="radio" aria-checked="${on}"`}><span>${op.t}</span><span class="mk">${I.check}</span></button>`;
      }).join('')}</div>
      ${multi?`<div class="after"><button class="btn" id="next" ${(cur||[]).length?'':'disabled'}>Continuar</button></div>`:''}</div>`;
  }
  app.innerHTML = headerBar(item.b, frac, secs) + body;
  document.getElementById('back').onclick = goBack;
  const nx = document.getElementById('next');
  if (nx) nx.onclick = advance;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (item.multi){
      let arr = st.a[id] ? [...st.a[id]] : [];
      arr = arr.includes(i) ? arr.filter(x => x!==i) : [...arr, i];
      st.a[id] = arr;
      app.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', arr.includes(+x.dataset.i)));
      document.getElementById('next').disabled = !arr.length;
    } else {
      st.a[id] = i;
      if (id==='q1' && item.o[i].k==='no') delete st.a.q2;
      app.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-checked', +x.dataset.i===i));
      setTimeout(advance, 260);
    }
  });
}
function advance(){
  const f = flow();
  st.hist.push(st.pos);
  if (st.pos < f.length-1){ st.pos++; render(); }
  else { st.screen='loading'; track('TestComplete'); render(); }
}
function goBack(){
  if (st.screen==='form'){ st.screen='step'; st.pos = flow().length-1; return render(); }
  if (!st.hist.length){ st.screen='intro'; return render(); }
  st.pos = st.hist.pop(); render();
}

function renderLoading(){
  const steps = ['Revisando todas las respuestas','Entendiendo qué estás gestionando en estos momentos','Conociendo tu proyecto'];
  const r = ringSvg('arc', 180, 78, 12);
  app.innerHTML = `<div class="loading enter"><h2>Preparando tu diagnóstico</h2>
    <div class="ring">${r.html}<div class="pct" id="pct">0%</div></div>
    <ul class="checks">${steps.map(s => `<li><span class="d">${I.check}</span>${s}</li>`).join('')}</ul></div>`;
  const arc = document.getElementById('arc'); arc.style.transition = 'none';
  let p = 0, paused = false, asked = false;
  const pct = document.getElementById('pct'), lis = app.querySelectorAll('.checks li'), seg = 100/steps.length;
  const tick = () => {
    if (st.screen!=='loading') return;
    if (!paused){
      p += 1;
      arc.setAttribute('stroke-dashoffset', r.C*(1-p/100));
      pct.textContent = p + '%';
      lis.forEach((li,i) => { const lo=i*seg, hi=lo+seg; li.className = p>=hi ? 'on' : (p>=lo ? 'run' : ''); });
      if (p===84 && !asked){ asked = true; paused = true; openSheet(() => { paused = false; }); }
      if (p>=100){ setTimeout(() => { st.screen='form'; render(); }, 450); return; }
    }
    setTimeout(tick, p<84 ? 50 : 40);
  };
  setTimeout(tick, 300);
}
function openSheet(done){
  const sh = document.getElementById('sheet'), sc = document.getElementById('scrim'), q = Q.despues;
  sh.innerHTML = `<div class="wrap"><div class="grab"></div><div class="why">Para afinar tu plan</div><h3 id="sheetTitle">${q.t}</h3>
    <div class="opts">${q.o.map((op,i) => `<button class="opt" data-i="${i}" role="radio" aria-checked="false"><span>${op.t}</span><span class="mk">${I.check}</span></button>`).join('')}</div></div>`;
  requestAnimationFrame(() => { sh.classList.add('show'); sc.classList.add('show'); });
  sh.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    st.a.despues = +b.dataset.i; b.setAttribute('aria-checked','true');
    setTimeout(() => { sh.classList.remove('show'); sc.classList.remove('show'); done(); }, 260);
  });
  setTimeout(() => sh.querySelector('.opt')?.focus(), 450);
}

function submit(){
  const n = document.getElementById('fn').value.trim(), z = document.getElementById('fz').value.trim();
  const raw = document.getElementById('ft').value.replace(/[\s.()-]/g,''), c = document.getElementById('fc').checked;
  const err = document.getElementById('ferr');
  let waNum = '', tel = '';
  const es = raw.replace(/^(\+34|0034)/,'');
  if (/^[67]\d{8}$/.test(es)){ tel = es; waNum = '34'+es; }
  else if (/^(\+|00)\d{10,15}$/.test(raw)){ tel = raw; waNum = raw.replace(/^(\+|00)/,''); }
  if (n.length<2) return err.textContent = 'Escribe tu nombre para personalizar el diagnóstico.';
  if (z.length<2) return err.textContent = 'Indica dónde se encuentra la propiedad.';
  if (!tel) return err.textContent = 'Revisa el teléfono: necesito un móvil de 9 cifras (o con prefijo internacional si no es español).';
  if (!c) return err.textContent = 'Para enviarte el diagnóstico necesito que aceptes la política de privacidad.';
  st.nombre = n; st.zona = z; st.tel = tel;
  track('Lead');
  if (CONFIG.webhookUrl){
    const r = compute(st.a), msg = waMessage(n, st.tipo, z, st.a);
    const params = Object.fromEntries(new URLSearchParams(location.search));
    try{
      const datos = {
        fecha:new Date().toLocaleString('es-ES',{timeZone:'Europe/Madrid'}), nombre:n, telefono:'+'+waNum, ubicacion:z,
        tipo:TIPOS.find(t => t.id===st.tipo).label, estado:Q.q1.o[st.a.q1].t,
        indice:r.idx, freno:AREAS[r.rank[0]].n, prioridades:r.rank.slice(0,3).map(k => AREAS[k].n).join(' | '),
        preocupaciones:(st.a.q3||[]).map(i => Q.q3.o[i].t).join(' | '),
        despues:st.a.despues!=null ? Q.despues.o[st.a.despues].t : '',
        codigo:encode(st.tipo, st.a), enlaceDiagnostico:reportUrl(st.tipo, st.a),
        mensajeWhatsApp:msg, abrirWhatsApp:waTo(waNum, msg),
        origen:params.utm_source||'', campana:params.utm_campaign||'', anuncio:params.utm_content||''
      };
      fetch(CONFIG.webhookUrl, {method:'POST', mode:'no-cors', keepalive:true, body:new URLSearchParams(datos)}).catch(() => {});
    }catch(e){}
  }
  st.screen='done'; render();
}

function renderDone(){
  const r = compute(st.a), noun = TIPOS.find(t => t.id===st.tipo).noun;
  const puntos = r.weak===1 ? 'un punto que puede estar frenando' : `${r.weak} puntos que pueden estar frenando`;
  const hi = `Hola Andrea, soy ${st.nombre}. Acabo de hacer el diagnóstico de mi ${noun} en ${st.zona} (código ${encode(st.tipo, st.a)}) y me gustaría hablar contigo.`;
  app.innerHTML = `<div class="done-pg enter">${brandRow()}
    <h2 style="margin-top:16px">¡Gracias, ${esc(st.nombre)}! Tu diagnóstico va camino de tu WhatsApp</h2>
    <div class="teaser"><b>He encontrado ${puntos} la venta de tu ${noun}.</b><p>${r.weak===1?'Te lo explico':'Te explico cada uno'} en el diagnóstico, con los pasos por orden.</p></div>
    <div class="box"><h3 style="font-size:18px;margin-bottom:14px">Qué pasa ahora</h3>${stepsList([
      {t:'Has respondido', p:'Ya tengo tus respuestas.', state:'done'},
      {t:'Mensaje a tu WhatsApp', p:'Vas a recibir un diagnóstico basado en tus respuestas.', state:'now'},
      {t:'¿Agendamos videollamada?', p:'En 20 minutos y sin compromiso, voy a explicarte el informe y cómo puedo ayudarte a vender al mejor precio de mercado.', state:'later'}
    ])}</div>
    <div class="cta">
      <a class="btn coral" href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener" id="ig"><span class="ic">${I.ig}</span>Sígueme en Instagram para más consejos y estar al día</a>
    </div>
    <div class="sign"><img src="${AVATAR}" alt=""><span>Andrea Dávila, asesora inmobiliaria online asociada a NOOW</span></div></div>
    <div class="foot"><span class="logo big" role="img" aria-label="NOOW. Una vida con vistas"></span></div>`;
  document.getElementById('ig').onclick = () => track('InstagramClick');
}

function renderReport(){
  const {tipo, a} = st.report, r = compute(a), noun = TIPOS.find(t => t.id===tipo).noun, top = r.rank.slice(0,3);
  const ring = ringSvg('arc2', 132, 56, 11);
  const q1 = key(a,'q1'), q2 = key(a,'q2');
  // Señal del mercado: causa principal y secundaria
  let senal = '';
  if (q1!=='no' && q2 && SENAL[q2]){
    const hits = SENAL[q2].c.filter(c => c.if(a));
    senal = `<div class="sect"><h3>Qué está pasando con los compradores</h3><div class="sig"><b>${SENAL[q2].t}</b><p>${hits[0].t}</p>${hits[1]?`<p class="also"><span>También puede influir:</span> ${hits[1].t}</p>`:''}</div></div>`;
  }
  // Preocupaciones ordenadas por relación con el freno
  const ws = (a.q3||[]).map(i => Q.q3.o[i].k).filter(k => WORRY[k]);
  const wsRank = w => { const i = r.rank.indexOf(WORRY[w].a); return i<0 ? 9 : i; };
  ws.sort((x,y) => wsRank(x) - wsRank(y));
  const shown = ws.slice(0,3), otros = marca(a,'otros') || ws.length>3;
  const wLabel = k => Q.q3.o.find(o => o.k===k).t.toLowerCase().replace(/^no puedo/,'no poder');
  const worriesHtml = (shown.length || otros) ? `<div class="sect"><h3>Lo que me contabas que te preocupa</h3>
    ${shown.map(k => `<div class="worry"><b>${esc(wLabel(k).charAt(0).toUpperCase()+wLabel(k).slice(1))}</b><p>${WORRY[k].t}</p></div>`).join('')}
    ${otros?`<p class="note-p">${OTROS_TXT}</p>`:''}</div>` : '';
  const tips = TIPS[['terreno','local'].includes(tipo) ? 'tl' : 'viv'];
  const after = a.despues!=null ? AFTER[Q.despues.o[a.despues].k] : null;
  const hi = `Hola Andrea, he leído mi diagnóstico (código ${encode(tipo, a)}) y me gustaría que hiciéramos la videollamada.`;
  app.innerHTML = `<div class="report enter">${brandRow()}
    <h2 style="margin-top:16px">Tu diagnóstico</h2>
    <p class="sub">Preparado por Andrea Dávila para la venta de tu ${noun}.</p>
    <div class="score"><div class="ring">${ring.html}<div class="pct"><div>${r.idx}<span>de 100</span></div></div></div>
      <div><div class="verdict">${r.label}</div><p>${r.desc}</p></div></div>
    <div class="sect"><h3>Tu situación</h3><p class="body-p">${CTX[tipo]}</p><p class="body-p">${TIEMPO[q1]}</p></div>
    ${senal}
    <div class="brake"><div class="k">Lo que más está frenando la venta</div><h3>${AREAS[top[0]].n}</h3><p>${AREAS[top[0]].d}</p></div>
    <div class="sect"><h3>Lo que te recomiendo, por orden</h3>
      <ol class="plan">${top.map(k => {
        const ex = AREA_EXTRA[k] ? AREA_EXTRA[k](a, tipo) : null;
        return `<li><b>${AREAS[k].n}</b><p class="pt">${AREA_TXT[k](a)}</p>${ex?`<p class="pt ex"><span>${ex.k}:</span> ${ex.t}</p>`:''}</li>`;
      }).join('')}</ol></div>
    ${worriesHtml}
    <div class="sect"><h3>Dos consejos para cuando empiecen las visitas</h3>
      <div class="tips">${tips.map(t => `<div class="tip"><b>${t.t}</b><p>${t.p}</p></div>`).join('')}</div>
      ${after?`<p class="note-p">${after.t}</p>${after.n?`<p class="fn">${after.n}</p>`:''}`:''}</div>
    <div class="box sect"><h3>¿Lo vemos juntos?</h3><p class="note-p" style="margin-top:8px">Te propongo una videollamada de 20 minutos, sin compromiso, para explicarte cómo he realizado este informe y cómo puedo ayudarte a vender al mejor precio de mercado.</p>
      <div class="cta" style="margin-top:16px">
        ${CONFIG.bookingUrl?`<a class="btn coral" href="${esc(CONFIG.bookingUrl)}" target="_blank" rel="noopener" id="book"><span class="ic">${I.cam}</span>Reservar videollamada</a>`:''}
        <a class="btn ${CONFIG.bookingUrl?'ghost':'coral'}" href="${waTo(CONFIG.whatsapp, hi)}" target="_blank" rel="noopener" id="wa"><span class="ic">${I.wa}</span>Escribir a Andrea por WhatsApp</a>
      </div></div>
    <div class="sign"><img src="${AVATAR}" alt=""><span>Andrea Dávila, asesora inmobiliaria online asociada a NOOW</span></div></div>
    <div class="foot"><span class="logo big" role="img" aria-label="NOOW. Una vida con vistas"></span></div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('arc2').setAttribute('stroke-dashoffset', ring.C*(1-r.idx/100))));
  document.getElementById('wa').onclick = () => track('ReportWhatsAppClick');
  const bk = document.getElementById('book'); if (bk) bk.onclick = () => track('BookingClick');
}

/* ---------- Panel de Andrea (#andrea) ---------- */
function renderPanel(){
  app.innerHTML = `<div class="panel enter">${brandRow()}
    <h2 style="margin-top:14px">Preparar el WhatsApp de un contacto</h2>
    <p class="sub">Pega el código del contacto (o el mensaje que te haya enviado) y completa sus datos. Se genera el mensaje con el enlace a su diagnóstico.</p>
    <textarea id="pin" placeholder="Código, por ejemplo 0021a10010, o el mensaje completo" style="margin-top:16px"></textarea>
    <div class="grid"><input id="pn" placeholder="Nombre"><input id="pt" placeholder="Teléfono" inputmode="tel"><input id="pz" placeholder="Dónde está la propiedad"></div>
    <div class="err" id="perr" role="alert" style="margin-top:8px"></div>
    <div id="pout"></div>
    <p style="margin-top:28px"><a href="#" id="toTest">Volver al test</a></p></div>`;
  const $ = id => document.getElementById(id);
  const upd = () => {
    const txt = $('pin').value, d = decode(txt), out = $('pout'), er = $('perr');
    if (!txt.trim()){ out.innerHTML=''; er.textContent=''; return; }
    if (!d){ out.innerHTML=''; er.textContent='No encuentro un código válido: son 10 caracteres, como 0021a10010.'; return; }
    er.textContent = '';
    const nm = $('pn').value.trim() || ((/soy ([^.,(\n]+)/i.exec(txt)||[])[1]||'').trim();
    const zn = $('pz').value.trim() || ((/ en ([^.,(\n]+?) \(código/i.exec(txt)||[])[1]||'').trim();
    const raw = $('pt').value.replace(/[\s.()-]/g,'').replace(/^(\+34|0034)/,'');
    const num = /^[67]\d{8}$/.test(raw) ? '34'+raw : raw.replace(/^(\+|00)/,'');
    const r = compute(d.a), msg = waMessage(nm, d.tipo, zn, d.a), link = reportUrl(d.tipo, d.a);
    out.innerHTML = `<div class="tags"><span>${esc(nm||'Sin nombre')}</span><span>${esc(TIPOS.find(t => t.id===d.tipo).label)}${zn?' en '+esc(zn):''}</span><span>Índice ${r.idx}/100</span>
      <span>${esc(Q.q1.o[d.a.q1].t)}</span><span>Freno: ${esc(AREAS[r.rank[0]].n.toLowerCase())}</span>${d.a.despues!=null?`<span>Después: ${esc(Q.despues.o[d.a.despues].t.toLowerCase())}</span>`:''}</div>
      <div class="out" id="ptext">${esc(msg)}</div>
      <div class="row2"><a class="btn coral" href="${waTo(num, msg)}" target="_blank" rel="noopener">${num?'Abrir su WhatsApp':'Abrir WhatsApp'}</a>
      <a class="btn ghost" href="${esc(link)}" target="_blank" rel="noopener">Ver su diagnóstico</a></div>
      <button class="btn ghost" id="copy" style="margin-top:10px">Copiar mensaje</button>`;
    $('copy').onclick = async (e) => {
      try{ await navigator.clipboard.writeText(msg); e.target.textContent='Copiado'; }
      catch(_){ const rg=document.createRange(); rg.selectNodeContents($('ptext')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); e.target.textContent='Texto seleccionado: cópialo con Ctrl/Cmd + C'; }
    };
  };
  ['pin','pn','pt','pz'].forEach(id => $(id).oninput = upd);
  $('toTest').onclick = (e) => { e.preventDefault(); location.hash=''; };
}

/* ---------- Rutas ---------- */
function route(){
  const h = location.hash;
  if (h==='#andrea'){ st.screen='panel'; }
  else if (h.startsWith('#diagnostico-')){
    const d = decode(h.slice(13));
    if (d){ st.report = d; st.screen='report'; }
    else st.screen='home';
  }
  else if (st.screen==='panel' || st.screen==='report'){ st.screen='home'; }
  render();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
